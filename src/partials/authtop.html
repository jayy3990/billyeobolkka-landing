<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:{{$font}}; color:var(--text); background:var(--bg); line-height:1.6; font-size:18px; word-break:keep-all; overflow-wrap:break-word; min-height:100vh; display:flex; flex-direction:column; }
  main { flex:1; }
  .wrap { max-width:720px; margin:0 auto; padding:0 20px; }
  header { padding:16px 0; }
  header .wrap { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:12px; font-size:24px; font-weight:800; color:var(--deep); text-decoration:none; margin-right:auto; }
  .brand svg { flex:none; width:44px; height:44px; }
  .lang { display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--surface); }
  .lang a { display:flex; align-items:center; justify-content:center; min-width:44px; min-height:42px; padding:0 8px; color:var(--text); text-decoration:none; font-weight:700; font-size:15px; }
  .lang a[aria-current] { background:var(--primary); color:var(--on-primary); }
  .auth-slot { display:inline-flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .auth-slot a, .auth-slot button { display:inline-flex; align-items:center; min-height:44px; padding:0 16px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--text); font:inherit; font-size:16px; font-weight:700; text-decoration:none; cursor:pointer; }
  .auth-slot a:hover, .auth-slot button:hover { background:var(--soft); color:var(--primary); }
  .narrow .wrap { max-width:480px; }
  .narrow { padding:24px 0 56px; }
  h1 { font-size:clamp(30px,8vw,40px); line-height:1.25; font-weight:800; color:var(--deep); }
  p.lead { margin-top:10px; font-size:18px; color:var(--muted); }
  .card { margin-top:22px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:22px 24px; }
  label { display:block; margin-top:18px; font-weight:800; }
  label:first-child { margin-top:0; }
  input[type=text], input[type=email], input[type=password] { width:100%; margin-top:6px; padding:14px 16px; font-size:18px; font-family:inherit; border:2px solid var(--line); border-radius:12px; background:var(--surface); color:var(--text); }
  .hint { margin-top:6px; color:var(--muted); font-size:15px; }
  .captcha { margin-top:18px; min-height:0; }
  .btn { display:flex; align-items:center; justify-content:center; width:100%; margin-top:22px; min-height:52px; padding:14px 24px; border-radius:999px; background:var(--primary); color:var(--on-primary); font-size:19px; font-weight:800; text-decoration:none; border:0; cursor:pointer; font-family:inherit; text-align:center; }
  .btn:disabled { opacity:.6; cursor:wait; }
  .btn.ghost { background:var(--surface); color:var(--primary); border:2px solid var(--primary); }
  a:focus-visible, button:focus-visible, input:focus-visible { outline:3px solid var(--primary); outline-offset:2px; }
  .links { margin-top:20px; color:var(--muted); font-size:16px; line-height:2; }
  .links a { color:var(--primary); font-weight:700; }
  #msg { margin-top:18px; padding:14px 16px; border-radius:12px; font-weight:700; display:none; }
  #msg.ok { display:block; background:var(--ok-bg); color:var(--ok-text); }
  #msg.err { display:block; background:var(--err-bg); color:var(--err-text); }
  .done { text-align:center; }
  .done h2 { font-size:26px; margin-bottom:10px; }
  .done p { color:var(--muted); margin-top:8px; }
  .kv { margin-top:6px; padding:14px 16px; border:2px solid var(--line); border-radius:12px; background:var(--bg); font-weight:700; word-break:break-all; }
  [hidden] { display:none !important; }
  footer { padding:28px 0 40px; color:var(--muted); font-size:16px; }
</style></head>
<body>
<header><div class="wrap">
  <a class="brand" href="{{$home}}"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" aria-hidden="true"><rect width="128" height="128" rx="28" fill="#1f6b4f"/><path d="M24 48 C40 44 53 46 61 54 L61 96 C53 89 40 87 24 91 Z" fill="#fff"/><path d="M104 48 C88 44 75 46 67 54 L67 96 C75 89 88 87 104 91 Z" fill="#fff"/><path d="M94 15 L96.8 23.2 L105 26 L96.8 28.8 L94 37 L91.2 28.8 L83 26 L91.2 23.2 Z" fill="#f0b457"/></svg>{{brand}}</a>
  <span class="auth-slot" data-auth-slot></span>
  <div class="lang" role="group" aria-label="{{nav.lang|attr}}" id="langs"><a href="{{$url_ko}}" lang="ko" hreflang="ko" {{$cur_ko}}>KO</a><a href="{{$url_en}}" lang="en" hreflang="en" {{$cur_en}}>EN</a></div>
</div></header>
