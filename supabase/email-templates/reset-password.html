<!-- Supabase > Authentication > Emails > "Reset password" 에 붙여 넣어요.
     Subject(제목):  [빌려볼까 · Billyeobolkka] 비밀번호 재설정 / Reset your password
     링크는 우리 사이트(/auth/confirm)가 서버에서 처리하고(type=recovery), 처리가 끝나면 새 비밀번호 화면으로 이동해요. -->
<div style="max-width:520px;margin:0 auto;padding:28px 20px;font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;color:#1d2230;">
  <div style="background:#4f46e5;color:#ffffff;border-radius:16px 16px 0 0;padding:20px 26px;font-size:20px;font-weight:700;">📖 빌려볼까 · Billyeobolkka</div>
  <div style="background:#ffffff;border:1px solid #d9dce8;border-top:0;border-radius:0 0 16px 16px;padding:26px;line-height:1.7;font-size:16px;">
    <p style="margin:0 0 10px;font-weight:700;">비밀번호 재설정 안내</p>
    <p style="margin:0 0 16px;">아래 버튼을 누르면 새 비밀번호를 정할 수 있어요. 요청하신 적이 없다면 이 메일을 무시해 주세요. 비밀번호는 바뀌지 않아요.</p>
    <p style="margin:0 0 22px;"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next={{ .RedirectTo }}" style="display:inline-block;background:#4f46e5;color:#ffffff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:12px;">새 비밀번호 정하기</a></p>
    <hr style="border:0;border-top:1px solid #d9dce8;margin:0 0 18px;">
    <p style="margin:0 0 10px;font-weight:700;">Reset your password</p>
    <p style="margin:0 0 16px;">Click the button below to choose a new password. If you didn't request this, you can ignore this email — your password won't change.</p>
    <p style="margin:0;"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next={{ .RedirectTo }}" style="display:inline-block;background:#4f46e5;color:#ffffff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:12px;">Set new password</a></p>
  </div>
</div>
